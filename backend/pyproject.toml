[project]
name = "kbtu-air-quality"
version = "1.0.0"
description = "Мониторинг и прогноз качества воздуха на кампусе КБТУ"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # Depends() в аргументах по умолчанию — идиома FastAPI
    "E501",  # длину строк контролирует форматтер
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py", "app/ml/prophet_model.py"]

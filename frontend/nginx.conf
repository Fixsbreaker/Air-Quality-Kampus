server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Внутренний nginx работает так, будто проект находится в корне сайта:
    # префикс пути (/air-quality) добавляет и снимает только публичный nginx.

    # ^~ отключает проверку регулярных location ниже, чтобы запрос вида
    # /api/report.csv не был перехвачен правилом кэширования статики.
    location ^~ /api/ {
        proxy_pass http://aqi-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Выгрузка наблюдений отдаётся потоком и может идти долго.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://aqi-api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Сборка Vite кладёт хеш в имя файла, поэтому статику можно кэшировать надолго.
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

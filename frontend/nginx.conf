server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Сборка Vite кладёт хеш в имя файла, поэтому статику можно кэшировать надолго.
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: kbtu-air-quality

# Развёртывание на собственном сервере (Oracle Cloud, DigitalOcean и любой
# другой VPS). Инструкция — docs/DEPLOY_VPS.md.
#
# Отличия от варианта для сервера КБТУ (docker-compose.prod.yml):
#   * проект живёт в корне домена, а не по пути /air-quality;
#   * нет внешней сети esg-network и чужого публичного nginx;
#   * добавлен сервис aqi-caddy — он терминирует HTTPS и сам получает
#     и продлевает сертификат Let's Encrypt;
#   * наружу открыты только 80 и 443, и только у aqi-caddy.
#
# Запуск:
#   docker compose -f docker-compose.vps.yml --env-file .env up -d --build

services:
  aqi-db:
    image: postgres:16-alpine
    container_name: aqi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - aqi-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aqi-redis:
    image: redis:7-alpine
    container_name: aqi_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - aqi-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aqi-api:
    build: ./backend
    container_name: aqi_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      aqi-db:
        condition: service_healthy
      aqi-redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - aqi-internal
    volumes:
      - models:/app/models
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  aqi-worker:
    build: ./backend
    container_name: aqi_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      aqi-api:
        condition: service_healthy
    networks:
      - aqi-internal
    volumes:
      - models:/app/models
    command: ["python", "-m", "app.worker"]

  aqi-bot:
    build: ./bot
    container_name: aqi_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      aqi-api:
        condition: service_healthy
    networks:
      - aqi-internal
    profiles: ["bot"]

  aqi-web:
    build:
      context: ./frontend
      args:
        # На своём домене проект отдаётся из корня, поэтому префикса нет.
        VITE_BASE_PATH: /
    container_name: aqi_frontend
    restart: unless-stopped
    depends_on:
      - aqi-api
    expose:
      - "80"
    networks:
      - aqi-internal

  aqi-caddy:
    image: caddy:2-alpine
    container_name: aqi_caddy
    restart: unless-stopped
    depends_on:
      - aqi-web
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    # Единственный сервис, открытый наружу. 80 нужен не только для редиректа,
    # но и для проверки владения доменом при выпуске сертификата.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aqi-internal

networks:
  aqi-internal:
    driver: bridge

volumes:
  pgdata:
  models:
  caddy_data:
  caddy_config:

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — линтер и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Проверка стиля (ruff)
        run: ruff check app tests scripts

      - name: Тесты с покрытием
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Сохранить отчёт о покрытии
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Миграции на PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqi
          POSTGRES_PASSWORD: aqi_password
          POSTGRES_DB: aqi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aqi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Накатить миграции
        env:
          DATABASE_URL: postgresql+psycopg://aqi:aqi_password@localhost:5432/aqi
        run: alembic upgrade head

      - name: Проверить обратимость (downgrade → upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://aqi:aqi_password@localhost:5432/aqi
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend — типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run lint

      - name: Сборка
        run: npm run build

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ backend
        run: docker build -t kbtu-aqi-backend:ci ./backend

      - name: Собрать образ бота
        run: docker build -t kbtu-aqi-bot:ci ./bot

      - name: Проверить docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

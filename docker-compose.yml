name: kbtu-air-quality

# Имена сервисов начинаются с префикса проекта: на сервере КБТУ все проекты
# живут в одной сети Docker, и общие имена вроде db, redis или frontend там
# конфликтуют между собой. Локальная конфигурация повторяет серверную, чтобы
# nginx.conf и переменные окружения были одинаковыми в обоих случаях.

services:
  aqi-db:
    image: postgres:16-alpine
    container_name: aqi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqi_password}
      POSTGRES_DB: ${POSTGRES_DB:-aqi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqi} -d ${POSTGRES_DB:-aqi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aqi-redis:
    image: redis:7-alpine
    container_name: aqi_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aqi-api:
    build: ./backend
    container_name: aqi_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      aqi-db:
        condition: service_healthy
      aqi-redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  aqi-worker:
    build: ./backend
    container_name: aqi_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      aqi-api:
        condition: service_healthy
    volumes:
      - models:/app/models
    command: ["python", "-m", "app.worker"]

  aqi-bot:
    build: ./bot
    container_name: aqi_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      aqi-api:
        condition: service_healthy
    profiles: ["bot"]

  aqi-web:
    build:
      context: ./frontend
      args:
        # Локально приложение отдаётся с корня; на сервере путь задаётся
        # в docker-compose.prod.yml. Адрес API не передаётся намеренно —
        # запросы уходят относительно базового пути, а внутренний nginx
        # проксирует /api/ в backend, поэтому CORS не задействован.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: aqi_frontend
    restart: unless-stopped
    depends_on:
      - aqi-api
    ports:
      - "5173:80"

volumes:
  pgdata:
  models:

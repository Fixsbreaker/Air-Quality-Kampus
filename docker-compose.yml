name: kbtu-air-quality

services:
  db:
    image: postgres:16-alpine
    container_name: aqi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqi_password}
      POSTGRES_DB: ${POSTGRES_DB:-aqi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqi} -d ${POSTGRES_DB:-aqi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aqi_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: aqi_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    container_name: aqi_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - models:/app/models
    command: ["python", "-m", "app.worker"]

  bot:
    build: ./bot
    container_name: aqi_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    profiles: ["bot"]

volumes:
  pgdata:
  models:
